<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear Usuario - El Bajón Urbano</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

  <header class="navbar">
    <div class="nav-contenedor">
      <a href="../index.html" class="logo">El Bajón Urbano</a>
      <button class="btn-menu" id="btnMenu">☰</button>
      <nav class="nav-links" id="navLinks">
        <a href="../index.html">Volver al Inicio</a>
        <a href="../index.html#menu">Carta</a>
      </nav>
    </div>
  </header>

  <main class="contenedor">
    <section class="seccion-info">
      <h2>Registro de Usuario</h2>
      <form class="formulario">
        <div style="margin-bottom: 15px;">
          <label for="nombre">Nombre Completo:</label><br>
          <input type="text" id="nombre" name="nombre" required style="width: 100%; padding: 8px; margin-top: 5px;">
        </div>
        <div style="margin-bottom: 15px;">
          <label for="email">Correo Electrónico:</label><br>
          <input type="email" id="email" name="email" required style="width: 100%; padding: 8px; margin-top: 5px;">
        </div>
        <div style="margin-bottom: 15px;">
          <label for="telefono">Teléfono:</label><br>
          <input type="tel" id="telefono" name="telefono" style="width: 100%; padding: 8px; margin-top: 5px;">
        </div>
        <button type="submit" class="btn-accion" style="border: none; cursor: pointer;">Registrarse</button>
      </form>
    </section>
  </main>

  <footer class="pie-pagina">
    <p>&copy; 2026 El Bajón Urbano. Todos los derechos reservados.</p>
  </footer>

  <script src="../js/main.js"></script>
</body>
</html>
